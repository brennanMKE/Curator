<!doctype html>
<!-- Source for assets/social-card.png (1200x630). Render: see website/README.md. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 56px; padding: 70px 80px; height: 100%; box-sizing: border-box; }
  .board-row--big { font-size: 118px; }
  .board-row--small { font-size: 34px; }
  .tag { margin-top: 34px; font-size: 30px; color: var(--wall-text); }
  .card img { width: 250px; }
</style></head>
<body><div class="card">
  <div>
    <div class="marquee">
      <div class="board-row board-row--small" data-text="JUST ADDED"></div>
      <div class="board-row board-row--big" data-text="CURATOR"></div>
    </div>
    <p class="tag">See what Plex just added. A Mac app for your Plex library.</p>
  </div>
  <img src="../assets/curator-robot.svg" alt="">
</div>
<script>
  for (const row of document.querySelectorAll(".board-row"))
    for (const ch of row.dataset.text) { const t = document.createElement("span"); t.className = ch === " " ? "tile space" : "tile"; t.textContent = ch === " " ? "" : ch; row.append(t); }
</script></body></html>
